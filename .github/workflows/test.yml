# [INPUT]: 依赖运行依赖与 tests 的离线用例。
# [OUTPUT]: 提供 Linux、Windows、macOS 的验证状态。
# [POS]: 仓库持续集成入口。不调用在线图源。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r zzm-applogo/requirements.txt
      - run: python -m unittest discover -s tests -v
